<article class="product-card">
  <a class="cover" href="{{ url_for('catalog.product_detail', slug=product.slug) }}">
    {% if product.display_cover %}
      <img src="{{ product.display_cover }}" alt="{{ product.title }}" loading="lazy"
           onerror="this.onerror=null;this.src='{{ url_for('static', filename='img/cover-placeholder.svg') }}';">
    {% else %}
      <img src="{{ url_for('static', filename='img/cover-placeholder.svg') }}" alt="{{ product.title }}" loading="lazy">
    {% endif %}
  </a>
  <div class="body">
    <a class="artist" href="{{ url_for('catalog.artist_detail', artist_slug=product.artist_slug) }}">{{ product.artist }}</a>
    <a class="title" href="{{ url_for('catalog.product_detail', slug=product.slug) }}">{{ product.title }}</a>
    <div class="meta">
      <span class="price">{{ product.price_display }}</span>
      {% if product.in_stock %}
        <span class="badge badge-ok">{{ product.condition }}</span>
      {% else %}
        <span class="badge badge-muted">Нет в наличии</span>
      {% endif %}
    </div>
  </div>
</article>
